<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de turnos - Pantalla principal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pantalla principal -->
     <div class="main-container">
        <h1>Gestor de turnos</h1>
        <!-- Contenedor del logo y registro del profesional -->
        <div class="logo-registro-container">
            <img src="img/logoPrincipal.jpeg" alt="logoPrincipal" class="logo">
            <div class="registro-profesional">
                <p class="leyenda">Primera vez aquí? regístrate y gestiona todos los turnos de una manera ágil y simple.
                </p>
                <button id="RegistrarmeBtn">Registrarme</button>
            </div>
        </div>
        <!-- Seccion de ingreso -->
         <div class="ingreso-container">
            <h2>Ingreso</h2>
            <div class="ingreso-buttons">
                <button id="adminBtn">Administrador</button>
                <button id="consultaBtn">Consulta turno</button>
            </div>
         </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
